name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un nouveau push sur une PR annule le build en cours de cette PR. Sur main, chaque push va au bout.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      chrome-url: ${{ steps.chrome.outputs.artifact-url }}
      firefox-url: ${{ steps.firefox.outputs.artifact-url }}
      suffix: ${{ steps.name.outputs.suffix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run build
      - run: npm run build:firefox
      - name: Lint Firefox (web-ext)
        run: npx --yes web-ext@8 lint --source-dir .output/firefox-mv3
      - name: Vérifier le script de l'app relais Xcode
        run: bash -n helpers/xcode/install.sh

      # Builds à tester, attachés au run (téléchargeables depuis l'onglet Checks de la PR).
      - name: Nom des builds
        id: name
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "suffix=pr${{ github.event.number }}-$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        id: chrome
        with:
          name: reviewhopper-chrome-${{ steps.name.outputs.suffix }}
          path: .output/chrome-mv3
          retention-days: 14
      - uses: actions/upload-artifact@v4
        id: firefox
        with:
          name: reviewhopper-firefox-${{ steps.name.outputs.suffix }}
          path: .output/firefox-mv3
          retention-days: 14
      - name: Mode d'emploi
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Tester ce build
          Télécharger l'artefact en bas de cette page (connexion GitHub requise).
          - **Chromium** (\`reviewhopper-chrome-${{ steps.name.outputs.suffix }}\`) : décompresser, puis \`chrome://extensions\`, Mode développeur, **Charger l'extension non empaquetée**.
          - **Firefox** (\`reviewhopper-firefox-${{ steps.name.outputs.suffix }}\`) : \`about:debugging#/runtime/this-firefox\`, **Charger un module complémentaire temporaire**, choisir le zip téléchargé.
          EOF

  # Liens directs vers les builds en tête de la description de la PR (bloc entre marqueurs, remplacé à
  # chaque run). PR du dépôt uniquement : une PR venant d'un fork n'a pas le droit d'écrire.
  links:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Liens vers les builds de test
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHROME_URL: ${{ needs.build.outputs.chrome-url }}
          FIREFOX_URL: ${{ needs.build.outputs.firefox-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          block=$(cat <<EOF
          <!-- reviewhopper-builds:start -->
          > **Builds de test** (commit ${HEAD_SHA::7}, gardés 14 jours, connexion GitHub requise)
          > - Chrome, Edge, Brave, Arc, Dia : [télécharger]($CHROME_URL), décompresser, puis \`chrome://extensions\` > Mode développeur > Charger l'extension non empaquetée.
          > - Firefox, Zen : [télécharger]($FIREFOX_URL), puis \`about:debugging#/runtime/this-firefox\` > Charger un module complémentaire temporaire > choisir le zip.
          >
          > [Détail du build]($RUN_URL)
          <!-- reviewhopper-builds:end -->
          EOF
          )
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json body -q .body > body.md
          python3 - "$block" <<'PY2'
          import re, sys
          block = sys.argv[1].strip()
          body = open('body.md').read()
          pat = re.compile(r'<!-- reviewhopper-builds:start -->.*?<!-- reviewhopper-builds:end -->', re.S)
          body = pat.sub(lambda m: block, body) if pat.search(body) else block + '\n\n' + body
          open('body.md', 'w').write(body)
          PY2
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --body-file body.md
